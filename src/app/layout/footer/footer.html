<footer class="bg-surface-light border-t border-border">
  <div class="container-padding py-12 lg:py-16">
    <div class="grid md:grid-cols-3 gap-10">
      <div>
        <div class="flex items-center gap-2">
          <img
            src="icons/logo/wr-logo-frame-gradient.svg"
            alt=""
            class="w-10 shrink-0 object-contain"
          />
          <p class="text-xl font-bold text-text-primary">ressutti.com</p>
        </div>
        <p
          i18n="@@layout.footer.brand.description"
          class="mt-4 text-sm text-text-secondary max-w-xs"
        >
          Building modern, scalable and robust digital solutions.
        </p>
      </div>

      <div>
        <h2
          id="footer-navigation-heading"
          i18n="@@layout.footer.navigation.heading"
          class="text-sm font-semibold text-text-primary mb-4"
        >
          Navigation
        </h2>
        <nav aria-labelledby="footer-navigation-heading">
          <ul class="flex flex-col gap-2 text-sm text-text-secondary">
            @for (nav of navs; track nav.id) {
              <li>
                <a
                  [hreflang]="nav.locale"
                  [routerLink]="nav.path"
                  routerLinkActive="text-accent"
                  ariaCurrentWhenActive="page"
                  [routerLinkActiveOptions]="{ exact: true }"
                  class="hover:text-accent transition"
                >
                  {{ nav.label }}
                </a>
              </li>
            }
          </ul>
        </nav>
      </div>

      <section aria-labelledby="footer-contact-heading">
        <h2
          id="footer-contact-heading"
          i18n="@@layout.footer.contact.heading"
          class="text-sm font-semibold text-text-primary mb-4"
        >
          Contact
        </h2>
        <address class="not-italic">
          <ul class="flex flex-col gap-2 text-sm text-text-secondary">
            @for (contact of contacts; track contact.id) {
              <li>
                <a
                  [href]="contact.url"
                  [attr.aria-label]="contact.accessibleLabel"
                  [attr.target]="contact.external ? '_blank' : null"
                  [attr.rel]="contact.external ? 'noopener noreferrer' : null"
                  class="hover:text-accent transition"
                  >{{ contact.label }}</a
                >
              </li>
            }
          </ul>
        </address>
      </section>
    </div>

    <div class="mt-10 pt-6 text-center text-sm text-text-tertiary">
      © {{ currentYear }} ressutti.com.
      <span i18n="@@layout.footer.legal.copyright">All rights reserved.</span>
    </div>
  </div>
</footer>
