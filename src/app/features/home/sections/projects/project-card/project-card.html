<div
  class="group flex flex-col h-full backdrop-blur-sm bg-surface-light rounded-2xl overflow-hidden border border-border hover:border-accent/40 transition-all duration-300 hover:-translate-y-1 hover:shadow-xl focus-within:*"
>
  <!-- Image -->
  <div class="relative shrink-0 overflow-hidden">
    <img
      [src]="project().coverImage"
      [alt]="project().imageAlt"
      [width]="project().coverWidth"
      [height]="project().coverHeight"
      loading="lazy"
      class="block w-full h-48 object-cover transition-transform duration-500 group-hover:scale-105"
    />

    <!-- Light Overlay -->
    <div
      aria-hidden="true"
      class="absolute inset-0 bg-black/10 group-hover:bg-black/20 transition"
    ></div>
  </div>

  <!-- Content -->
  <div class="p-5 flex flex-1 flex-col gap-4">
    <!-- Title -->
    <h3 class="text-xl font-semibold text-text-primary">
      {{ project().title }}
    </h3>

    <!-- Short Description -->
    <p class="text-text-secondary text-sm leading-relaxed">
      {{ project().shortDescription }}
    </p>

    <a
      [hreflang]="currentLocale"
      [routerLink]="['/', projectsPagePath, project().slug]"
      class="mt-auto inline-blocl w-fit font-medium text-accent hover:underline"
    >
      View details
    </a>
  </div>
</div>
