<article
  class="group flex flex-col h-full bg-surface-light rounded-xl overflow-hidden border border-border hover:border-accent/60 transition-all duration-300 hover:-translate-y-1 hover:shadow-xl focus-within:*"
>
  <!-- Image -->
  <div class="flex shrink-0 items-start justify-start p-3 overflow-hidden">
    <img
      [src]="project().coverImage"
      [alt]="project().imageAlt"
      [width]="project().coverWidth"
      [height]="project().coverHeight"
      loading="lazy"
      decoding="async"
      class="block aspect-video w-full bg-black/10 object-contain shadow-lg transition-transform duration-500 group-hover:scale-105"
    />
  </div>

  <!-- Content -->
  <div class="p-5 flex flex-1 flex-col gap-4">
    <!-- Title -->
    <h3 class="text-xl font-semibold text-text-primary">
      {{ project().title }}
    </h3>

    <!-- Short Description -->
    <p class="text-text-secondary text-sm leading-relaxed">
      {{ project().shortDescription }}
    </p>

    <a
      [hreflang]="currentLocale()"
      [routerLink]="[projectsPagePath(), project().slug]"
      class="mt-auto inline-blocl w-fit font-medium text-accent hover:underline"
    >
      View details
    </a>
  </div>
</article>
