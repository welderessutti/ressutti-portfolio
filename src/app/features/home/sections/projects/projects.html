<section id="projects" class="section-padding bg-surface border-b border-border-light">
  <div class="container-padding reveal" appRevealOnScroll>
    <h2
      i18n="@@home.projects.heading"
      class="text-3xl md:text-4xl font-bold mb-4 text-text-primary"
    >
      Projects
    </h2>
    <p i18n="@@home.projects.description" class="text-text-secondary mb-12">
      Selected work demonstrating end-to-end development, architectural decisions and dependable
      user experiences.
    </p>

    <ul
      class="flex flex-wrap items-stretch justify-center gap-6 [&>li]:flex [&>li]:flex-none [&>li]:basis-full md:[&>li]:basis-[calc(50%_-_0.75rem)] xl:[&>li]:basis-[calc(33.333333%_-_1rem)] [&>li>app-project-card]:w-full"
    >
      @for (project of allProjects; track project.id) {
        <li>
          <app-project-card
            [projectsPagePath]="viewAllProjectsButtonPath"
            [project]="project"
            [currentLocale]="currentLocale"
          ></app-project-card>
        </li>
      }
    </ul>

    <div class="mt-12 flex justify-center">
      <a
        i18n="@@home.projects.cta.viewAll.label"
        [hreflang]="currentLocale"
        [routerLink]="viewAllProjectsButtonPath"
        class="px-6 py-3 bg-accent text-text-inverse rounded-lg hover:bg-accent-hover transition font-medium shadow-lg hover:shadow-accent/30"
      >
        View all projects
      </a>
    </div>
  </div>
</section>
