<section id="hero" class="first-section-padding bg-surface-light border-b border-border-light">
  <div class="container-padding">
    <!-- Content -->
    <div class="md:max-w-xl">
      <!-- Title -->
      <h1
        class="flex flex-col text-[2rem] sm:text-5xl md:text-6xl font-bold tracking-tight text-text-primary leading-tight animate-fade-up"
      >
        <span i18n="@@home.hero.title.before">From ideas to</span>
        <span class="text-accent">
          {{ typedText() }}
          <span class="animate-blink text-text-primary">|</span>
        </span>
        <span i18n="@@home.hero.title.after"> digital solutions</span>
      </h1>
      <!-- Subtitle -->
      <p i18n="@@home.hero.subtitle" class="mt-6 text-text-secondary animate-fade-up delay-200">
        I am a <strong>full-stack developer</strong> specialising in <strong>Angular</strong> and
        <strong>Spring</strong>, building end-to-end web applications from responsive front ends to
        reliable back-end services.
      </p>

      <!-- Buttons -->
      <div class="mt-8 flex flex-wrap gap-4 animate-fade-up delay-300">
        <a
          i18n="@@home.hero.viewProjectsButton"
          [hreflang]="currentLocale"
          [routerLink]="viewProjectsButtonPath"
          class="px-6 py-3 bg-accent text-text-inverse rounded-lg hover:bg-accent-hover transition font-medium shadow-lg hover:shadow-accent/30"
          >View projects</a
        >

        <a
          i18n="@@home.hero.contactButton"
          [hreflang]="currentLocale"
          [routerLink]="contactButtonPath"
          class="px-6 py-3 bg-surface text-text-secondary border border-border rounded-lg hover:bg-surface-hover transition font-medium shadow-lg hover:shadow-gray-400/30"
          >Contact</a
        >
      </div>
    </div>
  </div>
</section>
