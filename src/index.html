<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta
      name="theme-color"
      content="#fcfcfe"
      data-theme-color-light="#fcfcfe"
      data-theme-color-dark="#0b0f19"
    />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        const root = document.documentElement;
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');

        let savedTheme = null;

        try {
          savedTheme = localStorage.getItem('theme');
        } catch {}

        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const isDark = savedTheme === 'dark' || (savedTheme !== 'light' && prefersDark);

        root.classList.toggle('dark', isDark);

        const colorAttribute = isDark ? 'data-theme-color-dark' : 'data-theme-color-light';

        const themeColor = themeColorMeta?.getAttribute(colorAttribute);

        if (themeColor) {
          themeColorMeta.setAttribute('content', themeColor);
        }
      })();
    </script>
    <title>Welder Ressutti | Full-stack Developer — Angular + Spring</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ressutti.com" />
    <link rel="manifest" href="site.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-background font-inter text-text-primary">
    <app-root></app-root>
  </body>
</html>
